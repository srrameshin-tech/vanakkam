async function copyText(text){
 try{
  const ta=document.createElement("textarea");
  ta.value=text;ta.setAttribute("readonly","");
  ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
  document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);
  const ok=document.execCommand("copy");
  document.body.removeChild(ta);
  if(ok)return true;
 }catch(e){console.warn(e)}
 try{
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}
 }catch(e){console.warn(e)}
 try{
  if(navigator.share){await navigator.share({text});return true}
 }catch(e){console.warn(e)}
 return false;
}

 const maxW=pw-130,avail=ph-130,titTa=M?"காலை வணக்கம்!":"இரவு வணக்கம்!",titEn=M?"GOOD MORNING!":"GOOD NIGHT!";
 let L=null;
 for(let sc=1;sc>=.5;sc-=.04){
  const sT=62*sc,sB=50*sc,sE=44*sc,sM=40*sc;
  x.font="700 "+sB+"px "+FONT;const la=wrapLines(x,item[0],maxW);
  x.font="500 "+sM+"px "+FONT;const le=wrapLines(x,item[1],maxW);
  const h=sT*1.35+la.length*sB*1.6+60+sE*1.4+le.length*sM*1.55;
  L={sT,sB,sE,sM,la,le,h};if(h<=avail)break;
 }
 let y=py+(ph-L.h)/2+L.sT;
 x.font="800 "+L.sT+"px "+FONT;x.fillStyle=tTa;x.fillText(titTa,540,y);y+=L.sT*.35;
 x.font="700 "+L.sB+"px "+FONT;x.fillStyle=ink;for(const t of L.la){y+=L.sB*1.6;x.fillText(t,540,y)}
 y+=34;x.fillStyle=M?"rgba(230,81,0,.5)":"rgba(255,213,79,.7)";x.fillRect(540-150,y,110,4);x.fillRect(540+40,y,110,4);flower(x,540,y+2,15,6,fa[0],fa[1],fa[2]);y+=22;
 x.font="800 "+L.sE+"px "+FONT;x.fillStyle=tEn;y+=L.sE*1.1;x.fillText(titEn,540,y);
 x.font="500 "+L.sM+"px "+FONT;x.fillStyle=bEn;for(const t of L.le){y+=L.sM*1.55;x.fillText(t,540,y)}
 // footer pill
 const fg=x.createLinearGradient(260,0,820,0);if(M){fg.addColorStop(0,"#e91e63");fg.addColorStop(1,"#ff7043")}else{fg.addColorStop(0,"#ffb300");fg.addColorStop(1,"#ff7043")}
 x.save();x.shadowColor="rgba(0,0,0,.3)";x.shadowBlur=18;x.shadowOffsetY=6;rr(x,250,1200,580,80,40);x.fillStyle=fg;x.fill();x.restore();
 x.font="700 44px "+FONT;x.fillStyle="#ffffff";x.fillText("🙏 Ramesh, Coimbatore",540,1256);
 return c;
}
async function cardBlob(){const c=drawCard();return await new Promise(r=>c.toBlob(r,"image/png"))}
function cardName(){return"vanakkam-"+dayLabel()+"-"+mode+".png"}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000)}
function flash(b,t,old){b.textContent=t;setTimeout(()=>b.textContent=old,2500)}
$("imgBtn").onclick=async()=>{
 const b=$("imgBtn"),old="🖼️ படமாகப் பகிர";
 try{
  const blob=await cardBlob(),file=new File([blob],cardName(),{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});markSent();return}
  downloadBlob(blob,cardName());markSent();flash(b,"✅ படம் Save ஆனது",old);
 }catch(e){if(e&&e.name==="AbortError")return;console.warn(e);flash(b,"📲 மீண்டும் முயற்சிக்கவும்",old)}
};
$("saveBtn").onclick=async()=>{
 const b=$("saveBtn"),old="💾 படம் Save";
 try{downloadBlob(await cardBlob(),cardName());markSent();flash(b,"✅ Save ஆனது",old)}
 catch(e){console.warn(e);flash(b,"📲 மீண்டும் முயற்சிக்கவும்",old)}
};
mode=autoMode();
render();setInterval(updateClock,30000);
fetch("messages.json",{cache:"no-store"}).then(r=>r.ok?r.json():[]).then(j=>{if(Array.isArray(j)&&j.length){AI=j;render()}}).catch(e=>console.warn(e));
</script>
