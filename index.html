function pickItem(){
 const idx=dayCount()-1+variation, S=mode==="morning"?[Am,Bm]:[An,Bn];
 const a=S[0][idx%S[0].length], b=S[1][idx%S[1].length];
 return [a[0]+" "+b[0], a[1]+" "+b[1]];
}
let mode="morning", variation=0;
const $=id=>document.getElementById(id);
function dayCount(){
 const now=new Date(); const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
 return Math.max(1,1+Math.floor((today-startDate.getTime())/86400000));
}
function dayLabel(){return String(dayCount()).padStart(3,"0")}
function updateClock(){
 const now=new Date();
 $("dateText").textContent=new Intl.DateTimeFormat("ta-IN",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}).format(now);
 $("timeText").textContent=new Intl.DateTimeFormat("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true}).format(now);
 $("dayNumber").textContent="#"+dayLabel();
}
function render(){
 const item=pickItem();
 $("greeting").textContent=mode==="morning"?"🌅 காலை வணக்கம்!":"🌙 இரவு வணக்கம்!";
 $("tamilText").textContent=item[0]; $("englishText").textContent=item[1];
 $("morningTab").classList.toggle("active",mode==="morning");
 $("nightTab").classList.toggle("active",mode==="night");
 updateClock();
}
function makeMessage(){
 const item=pickItem(), now=new Date();
 const date=new Intl.DateTimeFormat("ta-IN",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}).format(now);
 const time=new Intl.DateTimeFormat("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true}).format(now);
 const LN="━━━━━━━━━━━━━━", M=mode==="morning";
 return `${M?"🌅":"🌙"} *#${dayLabel()}* | ${date} | ${time}\n${LN}\n\n*${M?"காலை வணக்கம்":"இரவு வணக்கம்"}!*\n${item[0]}\n\n*${M?"GOOD MORNING":"GOOD NIGHT"}!*\n${item[1]}\n\n${LN}\n🙏 _Ramesh, Coimbatore_`;
}
$("morningTab").onclick=()=>{mode="morning";variation=0;render()};
$("nightTab").onclick=()=>{mode="night";variation=0;render()};
$("newBtn").onclick=()=>{variation++;render()};
async function copyText(text){
 try{
  const ta=document.createElement("textarea");
  ta.value=text;ta.setAttribute("readonly","");
  ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
  document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);
  const ok=document.execCommand("copy");
  document.body.removeChild(ta);
  if(ok)return true;
 }catch(e){console.warn(e)}
 try{
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}
 }catch(e){console.warn(e)}
 try{
  if(navigator.share){await navigator.share({text});return true}
 }catch(e){console.warn(e)}
 return false;
}
$("copyBtn").onclick=async()=>{
 const b=$("copyBtn");
 const ok=await copyText(makeMessage());
 b.textContent=ok?"✅ Copied":"📲 WhatsApp பொத்தானைப் பயன்படுத்தவும்";
 setTimeout(()=>b.textContent="📋 Copy",ok?1500:2500);
};
$("shareBtn").onclick=()=>{location.href="https://wa.me/?text="+encodeURIComponent(makeMessage())};
let installPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;$("installBtn").style.display="block"});
$("installBtn").onclick=async()=>{if(!installPrompt){alert("Chrome மெனுவில் 'Add to Home screen' என்பதைத் தேர்வு செய்யவும்.");return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$("installBtn").style.display="none"};
if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
 let hadCtl=!!navigator.serviceWorker.controller,reloaded=false;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadCtl&&!reloaded){reloaded=true;location.reload()}hadCtl=true})}
render();setInterval(updateClock,30000);
